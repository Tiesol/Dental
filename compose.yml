services:
  db:
    image: postgres:16
    container_name: dental-db
    restart: on-failure
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
    ports:
      - '127.0.0.1:${DB_PORT}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db_test:
    image: postgres:16
    container_name: dental-db-test
    restart: on-failure
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_TEST_DB}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
    ports:
      - '127.0.0.1:${DB_TEST_PORT}:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_TEST_DB}']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: dental-backend
    restart: on-failure
    env_file:
      - backend/.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - PORT=3000
      - FRONTEND_URL=http://localhost:5173
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:3000/api/v1
        - VITE_CLINIC_TIMEZONE=America/La_Paz
    container_name: dental-frontend
    restart: on-failure
    ports:
      - '127.0.0.1:5173:80'
    depends_on:
      - backend

volumes:
  pgdata:
